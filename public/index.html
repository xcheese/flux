<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地知识库</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Local Knowledge</p>
        <h1>知识库后台</h1>
      </div>
      <div class="top-actions">
        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="主题、类型、总结、重要点、正文" autocomplete="off" />
        </label>
        <button id="focusButton" class="icon-button" type="button" title="沉浸阅读" aria-label="沉浸阅读">⛶</button>
      </div>
    </header>

    <main class="dashboard-shell">
      <section class="table-panel" aria-label="文档后台表格">
        <div class="panel-toolbar">
          <div>
            <h2>文档表</h2>
            <p id="tableCount">按文档时间倒序</p>
          </div>
          <button id="resetButton" type="button">全部</button>
        </div>

        <div class="summary-strip" id="stats"></div>

        <div class="filters">
          <div>
            <span class="filter-label">目录</span>
            <div id="bucketFilters" class="filter-row"></div>
          </div>
          <div>
            <span class="filter-label">类型</span>
            <div id="tagFilters" class="tag-row"></div>
          </div>
        </div>

        <div class="table-scroll">
          <table class="doc-table">
            <colgroup>
              <col class="w-index" />
              <col class="w-date" />
              <col class="w-types" />
              <col class="w-topic" />
              <col class="w-summary" />
              <col class="w-important" />
              <col class="w-inspiration" />
            </colgroup>
            <thead>
              <tr>
                <th>序号</th>
                <th>文档时间</th>
                <th>类型</th>
                <th>主题</th>
                <th>一句话总结</th>
                <th>重要点</th>
                <th>启发性</th>
              </tr>
            </thead>
            <tbody id="documentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="readerOverlay" class="reader-overlay" aria-hidden="true">
      <div class="reader-backdrop" data-close-reader></div>
      <article class="reader-dialog" aria-label="笔记内容" role="dialog" aria-modal="true">
        <header class="reader-dialog-head">
          <div>
            <p class="eyebrow">Document Detail</p>
            <h2 id="readerDialogTitle">文档详情</h2>
          </div>
          <button id="closeReaderButton" class="icon-button" type="button" aria-label="关闭详情">×</button>
        </header>
        <div id="reader" class="reader">
          <div class="empty-reader">
            <h2>选择一篇文档</h2>
            <p>点击表格行或“打开”查看具体内容。</p>
          </div>
        </div>
      </article>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
