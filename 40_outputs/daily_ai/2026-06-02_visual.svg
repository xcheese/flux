<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AI News 2026-06-02</title>
  <desc id="desc">三条高价值 AI 情报：MiniMax M3、Google SRE AI、SkillHarm 技能攻击。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#d8dee8" flood-opacity="0.7"/>
    </filter>
    <style>
      .base { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .kicker { font-size: 24px; font-weight: 800; fill: #2563eb; }
      .headline { font-size: 48px; font-weight: 900; fill: #111827; }
      .sub { font-size: 27px; font-weight: 500; fill: #475569; }
      .badge { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .card-title { font-size: 34px; font-weight: 900; fill: #111827; }
      .card-text { font-size: 25px; font-weight: 520; fill: #334155; }
      .action { font-size: 29px; font-weight: 900; fill: #111827; }
      .action-sub { font-size: 25px; font-weight: 520; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>

  <g class="base">
    <rect x="54" y="48" width="1292" height="150" rx="26" fill="#ffffff" filter="url(#shadow)"/>
    <text x="88" y="94" class="kicker">AI NEWS 2026-06-02</text>
    <text x="88" y="145" class="headline">Agent 红利开始转向：模型、生产、技能安全</text>
    <text x="88" y="181" class="sub">主线：开放权重逼近 / 真实运维落地 / 第三方 skill 风险</text>

    <g transform="translate(54 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="136" height="38" rx="19" fill="#2563eb"/>
      <text x="48" y="54" class="badge">模型战</text>
      <text x="28" y="118" class="card-title">MiniMax M3</text>
      <text x="28" y="160" class="card-title">开放权重倒计时</text>
      <text x="28" y="220" class="card-text">1M context + 多模态</text>
      <text x="28" y="258" class="card-text">coding / agentic 主打</text>
      <text x="28" y="296" class="card-text">先等权重和复测</text>
    </g>

    <g transform="translate(500 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="148" height="38" rx="19" fill="#16a34a"/>
      <text x="48" y="54" class="badge">生产落地</text>
      <text x="28" y="118" class="card-title">Google SRE AI</text>
      <text x="28" y="160" class="card-title">不止做 RCA</text>
      <text x="28" y="220" class="card-text">playbook / alert / incident</text>
      <text x="28" y="258" class="card-text">agent 要有身份权限</text>
      <text x="28" y="296" class="card-text">持续评测和审计</text>
    </g>

    <g transform="translate(946 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="152" height="38" rx="19" fill="#dc2626"/>
      <text x="48" y="54" class="badge">技能安全</text>
      <text x="28" y="118" class="card-title">SkillHarm</text>
      <text x="28" y="160" class="card-title">skill 会自变异</text>
      <text x="28" y="220" class="card-text">879 个攻击样本</text>
      <text x="28" y="258" class="card-text">最高 86.3% 成功率</text>
      <text x="28" y="296" class="card-text">第三方 skill 先隔离</text>
    </g>

    <rect x="54" y="638" width="1292" height="118" rx="26" fill="#ffffff" filter="url(#shadow)"/>
    <text x="88" y="694" class="action">今天最值钱的动作：开放模型先观察，生产 agent 先立规矩，skill 先做隔离审计</text>
    <text x="88" y="735" class="action-sub">不要把“能跑”误认为“能托管”；不要把“skill 有用”误认为“skill 可信”</text>
    <path d="M1228 657 L1264 693 L1228 729" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1178" y1="693" x2="1261" y2="693" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
