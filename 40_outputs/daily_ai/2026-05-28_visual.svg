<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #111827;
    }
    .eyebrow { font-size: 24px; font-weight: 750; fill: #2563eb; }
    .title { font-size: 46px; font-weight: 850; }
    .subtitle { font-size: 28px; fill: #475569; }
    .card-title { font-size: 34px; font-weight: 850; }
    .card-text { font-size: 25px; fill: #334155; }
    .badge { font-size: 22px; font-weight: 800; fill: #ffffff; }
    .action { font-size: 28px; font-weight: 800; fill: #0f172a; }
    .action-sub { font-size: 24px; fill: #475569; }
  </style>

  <rect width="1400" height="820" rx="0" fill="url(#bg)"/>
  <rect x="54" y="48" width="1292" height="150" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="94" class="eyebrow">AI NEWS 2026-05-28</text>
  <text x="88" y="145" class="title">Agent 开始碰钱，系统边界要升级</text>
  <text x="88" y="180" class="subtitle">主线：真钱权限 / 后端鉴权 / 检索路由</text>

  <g transform="translate(54 230)">
    <rect width="402" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="124" height="38" rx="19" fill="#16a34a"/>
    <text x="48" y="54" class="badge">真钱权限</text>
    <text x="28" y="118" class="card-title">Robinhood 开放</text>
    <text x="28" y="160" class="card-title">交易与信用卡</text>
    <text x="28" y="220" class="card-text">Agent 从建议走向执行</text>
    <text x="28" y="258" class="card-text">限额、日志、责任归属</text>
    <text x="28" y="296" class="card-text">必须先成为产品能力</text>
  </g>

  <g transform="translate(500 230)">
    <rect width="402" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="142" height="38" rx="19" fill="#dc2626"/>
    <text x="48" y="54" class="badge">基础设施债</text>
    <text x="28" y="118" class="card-title">BadHost 暴露</text>
    <text x="28" y="160" class="card-title">路径鉴权风险</text>
    <text x="28" y="220" class="card-text">FastAPI / Starlette / MCP</text>
    <text x="28" y="258" class="card-text">先查 request.url.path</text>
    <text x="28" y="296" class="card-text">再谈开放 agent 后端</text>
  </g>

  <g transform="translate(946 230)">
    <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="124" height="38" rx="19" fill="#7c3aed"/>
    <text x="48" y="54" class="badge">检索路由</text>
    <text x="28" y="118" class="card-title">grep 不是</text>
    <text x="28" y="160" class="card-title">RAG 的替代品</text>
    <text x="28" y="220" class="card-text">小文本用 grep</text>
    <text x="28" y="258" class="card-text">复杂文档先解析</text>
    <text x="28" y="296" class="card-text">大库走混合检索</text>
  </g>

  <rect x="54" y="638" width="1292" height="118" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="694" class="action">今天最值钱的动作：为自己的 agent 建三张表</text>
  <text x="88" y="735" class="action-sub">权限额度表 / 后端安全清单 / 本地检索路由表</text>
  <path d="M1180 686h80m0 0-30-30m30 30-30 30" stroke="#2563eb" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
