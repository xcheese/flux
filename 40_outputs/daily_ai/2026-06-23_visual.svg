<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">2026-06-23 AI 高价值信息精华图</title>
  <desc id="desc">三条信号：AI cyber risk、Claude thinking audit boundary、Selector Forge live DOM verification。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .accent-blue { fill: #1f5eff; }
      .accent-red { fill: #ef4444; }
      .accent-green { fill: #149b6f; }
      .accent-amber { fill: #d97706; }
      .ink { fill: #151922; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #596273; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .tiny { font-size: 22px; }
      .small { font-size: 28px; }
      .mid { font-size: 34px; font-weight: 700; }
      .big { font-size: 48px; font-weight: 800; }
      .tag { font-size: 21px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="820"/>

  <text class="ink big" x="70" y="92">今天主线：Agent 生产化，先解决“可信执行”</text>
  <text class="muted small" x="72" y="138">不是更会说，而是能防御、能留证、能被真实环境验收。</text>

  <rect class="panel" x="70" y="185" width="390" height="350" rx="18"/>
  <rect class="accent-red" x="100" y="220" width="92" height="34" rx="17"/>
  <text class="ink tag" x="216" y="245">Five Eyes / CISA</text>
  <text fill="#ffffff" font-size="20" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="126" y="244">风险</text>
  <text class="ink mid" x="100" y="305">防御窗口变短</text>
  <text class="muted small" x="100" y="358">AI 压缩攻击链</text>
  <text class="muted small" x="100" y="402">补丁、身份、攻击面</text>
  <text class="muted small" x="100" y="446">从 IT 议题变经营风险</text>

  <rect class="panel" x="505" y="185" width="390" height="350" rx="18"/>
  <rect class="accent-amber" x="535" y="220" width="92" height="34" rx="17"/>
  <text class="ink tag" x="651" y="245">Claude thinking</text>
  <text fill="#ffffff" font-size="20" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="561" y="244">审计</text>
  <text class="ink mid" x="535" y="305">摘要不是证据链</text>
  <text class="muted small" x="535" y="358">Thinking 可被省略或摘要</text>
  <text class="muted small" x="535" y="402">可审计的是输入、动作</text>
  <text class="muted small" x="535" y="446">来源、diff、测试结果</text>

  <rect class="panel" x="940" y="185" width="390" height="350" rx="18"/>
  <rect class="accent-green" x="970" y="220" width="92" height="34" rx="17"/>
  <text class="ink tag" x="1086" y="245">Selector Forge</text>
  <text fill="#ffffff" font-size="20" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" x="996" y="244">验证</text>
  <text class="ink mid" x="970" y="305">AI 提案，环境拍板</text>
  <text class="muted small" x="970" y="358">Selector 先由 AI 生成</text>
  <text class="muted small" x="970" y="402">再用 live DOM 复验</text>
  <text class="muted small" x="970" y="446">适合浏览器自动化</text>

  <rect x="70" y="585" width="1260" height="150" rx="24" fill="#edf4ff" stroke="#c7d9ff" stroke-width="2"/>
  <circle class="accent-blue" cx="118" cy="637" r="9"/>
  <text class="ink mid" x="145" y="649">今天可执行</text>
  <text class="muted small" x="335" y="649">插件/MCP 先看权限边界；报告只信证据链；浏览器任务加入 live check。</text>
  <text class="muted tiny" x="145" y="695">下一步盯：AI cyber agency 指引、agent 审计日志实践、DOM/工具调用的自动验收模式。</text>
</svg>
