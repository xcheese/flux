    <text x="42" y="54" style="font:850 27px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">今天动作：给 AI news 加风险分、30 天复盘点和跨 agent 记忆候选清单</text>
