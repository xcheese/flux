<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">2026-06-08 AI 情报精华图</title>
  <desc id="desc">Agent 红利转向可控闭环：风险控制、轨迹复盘、跨 agent 记忆。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183246" flood-opacity="0.13"/>
    </filter>
    <style>
      .label{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#607085}
      .title{font:850 50px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#142033}
      .sub{font:550 26px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#4d6073}
      .cardTitle{font:850 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172438}
      .body{font:650 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#506376}
      .hint{font:750 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#66788b}
      .num{font:900 36px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <rect x="44" y="42" width="1312" height="736" rx="34" fill="#ffffff" stroke="#dce7ef" filter="url(#shadow)"/>

  <text x="92" y="112" class="label">AI NEWS · 2026-06-08</text>
  <text x="92" y="178" class="title">Agent 红利转向可控闭环</text>
  <text x="92" y="224" class="sub">不只让它多做事，更要控风险、复盘轨迹、沉淀记忆</text>

  <g transform="translate(92 286)">
    <rect x="0" y="0" width="370" height="246" rx="22" fill="#f6fbff" stroke="#cfe0f1"/>
    <circle cx="54" cy="55" r="28" fill="#2f78c8"/>
    <text x="43" y="67" class="num">1</text>
    <text x="94" y="61" class="cardTitle">先控风险</text>
    <text x="32" y="124" class="body">OpenAI Moderation</text>
    <text x="32" y="160" class="body">与 Lockdown 入场</text>
    <text x="32" y="203" class="hint">输入输出都要留安全分</text>
  </g>

  <g transform="translate(515 286)">
    <rect x="0" y="0" width="370" height="246" rx="22" fill="#f8fff8" stroke="#d4e8d4"/>
    <circle cx="54" cy="55" r="28" fill="#2f8d56"/>
    <text x="43" y="67" class="num">2</text>
    <text x="94" y="61" class="cardTitle">复盘轨迹</text>
    <text x="32" y="124" class="body">RHO 用历史任务</text>
    <text x="32" y="160" class="body">改进 skills + tools</text>
