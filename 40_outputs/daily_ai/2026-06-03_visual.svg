<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AI News 2026-06-03</title>
  <desc id="desc">三条高价值 AI 情报：OpenAI role-based plugins、Microsoft agent trust stack、vLLM session-aware routing。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#d8dee8" flood-opacity="0.7"/>
    </filter>
    <style>
      .base { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .kicker { font-size: 24px; font-weight: 800; fill: #2563eb; }
      .headline { font-size: 48px; font-weight: 900; fill: #111827; }
      .sub { font-size: 27px; font-weight: 500; fill: #475569; }
      .badge { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .card-title { font-size: 34px; font-weight: 900; fill: #111827; }
      .card-text { font-size: 25px; font-weight: 520; fill: #334155; }
      .action { font-size: 29px; font-weight: 900; fill: #111827; }
      .action-sub { font-size: 25px; font-weight: 520; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>

  <g class="base">
    <rect x="54" y="48" width="1292" height="150" rx="26" fill="#ffffff" filter="url(#shadow)"/>
    <text x="88" y="94" class="kicker">AI NEWS 2026-06-03</text>
    <text x="88" y="145" class="headline">Agent 开始从工具，变成可运营系统</text>
    <text x="88" y="181" class="sub">主线：角色插件 / 运行时控制 / 会话级模型路由</text>

    <g transform="translate(54 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="146" height="38" rx="19" fill="#2563eb"/>
      <text x="48" y="54" class="badge">角色插件</text>
      <text x="28" y="118" class="card-title">OpenAI Plugins</text>
      <text x="28" y="160" class="card-title">岗位化 Codex</text>
      <text x="28" y="220" class="card-text">Sales / Data / Design</text>
      <text x="28" y="258" class="card-text">skills + connectors</text>
      <text x="28" y="296" class="card-text">插件要先定权限</text>
    </g>

    <g transform="translate(500 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="154" height="38" rx="19" fill="#16a34a"/>
      <text x="48" y="54" class="badge">运行控制</text>
      <text x="28" y="118" class="card-title">Microsoft ACS</text>
      <text x="28" y="160" class="card-title">Agent 365 / MXC</text>
      <text x="28" y="220" class="card-text">身份、策略、审计</text>
      <text x="28" y="258" class="card-text">本地 agent 也纳管</text>
      <text x="28" y="296" class="card-text">DLP 进 prompt 路径</text>
    </g>

    <g transform="translate(946 230)">
      <rect width="400" height="360" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="28" y="28" width="154" height="38" rx="19" fill="#dc2626"/>
      <text x="48" y="54" class="badge">会话路由</text>
      <text x="28" y="118" class="card-title">vLLM SAAR</text>
      <text x="28" y="160" class="card-title">auto 要可解释</text>
      <text x="28" y="220" class="card-text">tool loop 不乱切</text>
      <text x="28" y="258" class="card-text">prefix cache 算成本</text>
      <text x="28" y="296" class="card-text">路由要能回放</text>
    </g>

    <rect x="54" y="638" width="1292" height="118" rx="26" fill="#ffffff" filter="url(#shadow)"/>
    <text x="88" y="694" class="action">今天最值钱的动作：把 AI news 升级成 role plugin + 权限表 + 路由账本</text>
    <text x="88" y="735" class="action-sub">不要只堆 skill；把角色、连接器、模型选择和审计一起设计</text>
    <path d="M1228 657 L1264 693 L1228 729" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1178" y1="693" x2="1261" y2="693" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
